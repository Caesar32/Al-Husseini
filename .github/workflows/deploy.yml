name: Deploy to Hostinger

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy via Native SSH
    # A manual run is an escape hatch for main only; it does not run the tests first.
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy to Hostinger
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_TARGET_PATH: ${{ secrets.REMOTE_TARGET_PATH }}
          BRANCH: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Secrets pasted with a trailing newline/space break the ssh command line.
          HOST=$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')
          PORT=$(printf '%s' "$SSH_PORT" | tr -d '[:space:]')
          USER_NAME=$(printf '%s' "$SSH_USER" | tr -d '[:space:]')
          TARGET=$(printf '%s' "$REMOTE_TARGET_PATH" | tr -d '\r\n')

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh -o StrictHostKeyChecking=no \
              -o PubkeyAcceptedKeyTypes=+ssh-rsa \
              -o HostKeyAlgorithms=+ssh-rsa \
              -p "$PORT" \
              "$USER_NAME@$HOST" << EOF
            set -e
            cd "$TARGET"
            # \$ is evaluated on the server; a bare $ is filled in by the runner before sending.
            PREV=\$(git rev-parse HEAD)
            rollback() {
              trap - ERR
              set +e
              echo "Deploy failed. Restoring \$PREV"
              git reset --hard "\$PREV"
              composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts
              php artisan package:discover --ansi
              php artisan optimize:clear
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache
              php artisan up
              exit 1
            }
            trap rollback ERR
            php artisan down || true
            git fetch "https://x-access-token:$GH_TOKEN@github.com/$GH_REPO.git" "$BRANCH"
            git reset --hard FETCH_HEAD
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader --no-scripts
            php artisan package:discover --ansi
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan up
            echo "✅ Deployment successful!"
          EOF

      - name: Health check
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors --max-time 20 --output /dev/null https://alhusseini.shop/up
