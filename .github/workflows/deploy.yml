name: Deploy to Hostinger

on:
  push:
    branches:
      - main
      - remediation/2026-10

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy via Native SSH
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hostinger
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          REMOTE_TARGET_PATH: ${{ secrets.REMOTE_TARGET_PATH }}
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Secrets pasted with a trailing newline/space break the ssh command line.
          HOST=$(printf '%s' "$SSH_HOST" | tr -d '[:space:]')
          PORT=$(printf '%s' "$SSH_PORT" | tr -d '[:space:]')
          USER_NAME=$(printf '%s' "$SSH_USER" | tr -d '[:space:]')
          TARGET=$(printf '%s' "$REMOTE_TARGET_PATH" | tr -d '\r\n')

          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh -o StrictHostKeyChecking=no \
              -o PubkeyAcceptedKeyTypes=+ssh-rsa \
              -o HostKeyAlgorithms=+ssh-rsa \
              -p "$PORT" \
              "$USER_NAME@$HOST" << EOF
            set -e
            trap 'php artisan up' ERR
            cd "$TARGET"
            php artisan down || true
            git fetch "https://x-access-token:$GH_TOKEN@github.com/$GH_REPO.git" "$BRANCH"
            git reset --hard FETCH_HEAD
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan up
            echo "✅ Deployment successful!"
          EOF
